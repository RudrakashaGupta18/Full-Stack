<!DOCTYPE html>
<html>
<head>
    <title>HTML Forms</title>
</head>
<body>

    <h1>Registration Form</h1>

    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter name">

        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter email">

        <br><br>

        <label>Password:</label>
        <input type="password">

        <br><br>

        <button type="submit">Register</button>
    </form>

</body>
</html>
