<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy your Shoes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form action="">
            <img src="images.jpeg" alt="images" id="aa">
            <p>Athleisure Shoes for Men</p>
            <h2>$1200</h2>
            <div class="cart">
                <button type="submit">Buy</button>
                <button type="submit"><img src="shopping.png" alt="shopping" width="15px">Add to cart</button> 
            </div>
            <div class="share">
                <img src="facebook.png" alt="facebook" width="50px">
                <img src="twitter.png" alt="twitter" width="50px">
                <img src="whatsapp.png" alt="whatsapp" width="50px">
            </div>
        </form>
    </div>
    
</body>
</html>
