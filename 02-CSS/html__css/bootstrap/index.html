<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bootstrap CSS Only Example</title>
  
  <!-- Bootstrap CSS Only -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <h1 class="text-center text-primary">Bootstrap CSS Only Example</h1>

    <!-- Spacing and Grid -->
    <div class="row mt-4">
      <div class="col-md-4">
        <div class="p-3 bg-warning text-white rounded">Column 1</div>
      </div>
      <div class="col-md-4">
        <div class="p-3 bg-success text-white rounded">Column 2</div>
      </div>
      <div class="col-md-4">
        <div class="p-3 bg-danger text-white rounded">Column 3</div>
      </div>
    </div>

    <!-- Buttons and Text -->
    <div class="text-center mt-5">
      <p class="text-muted">This is a muted paragraph with margin and padding utilities.</p>
      <button class="btn btn-outline-primary">Click Me</button>
    </div>

    <!-- Borders and Helpers -->
    <div class="mt-5 p-3 border border-2 border-dark rounded Shadow ">
      <h4 class="text-center">Border & Shadow Example</h4>
    </div>
  </div>

</body>
</html>
